kind = "web"
previewPath = "/"
title = "Crypto TradePro Portfolio"
description = "A paper-trading portfolio dashboard for monitoring positions, live mark-to-market P&L, realized trade history, and safe INR balance controls."
version = "1.0.0"
id = "artifacts/crypto-tradepro"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18925

[services.development]
run = "pnpm --filter @workspace/crypto-tradepro run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/crypto-tradepro", "run", "build" ]
serve = "static"
publicDir = "artifacts/crypto-tradepro/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18925"
BASE_PATH = "/"
